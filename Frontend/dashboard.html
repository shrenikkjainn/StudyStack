<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyStack - Dashboard</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    
    <!-- Navigation -->
    <nav class="dashboard-nav glass-panel" style="border-radius: 0; border-top: none; border-left: none; border-right: none; margin-bottom: 20px;">
        <div class="brand">StudyStack</div>
        <div class="nav-actions">
            <span class="user-info" id="user-display-name">Loading...</span>
            <button id="logout-btn" class="btn-small">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="section-header">
            <h2>Available Courses</h2>
            <button id="show-create-modal-btn" class="btn btn-small hidden" style="width: auto;">+ Create Course</button>
        </div>

        <div id="courses-grid" class="courses-grid">
            <!-- Courses will be dynamically injected here -->
            <p style="color: var(--text-muted);">Loading courses...</p>
        </div>
    </main>

    <!-- Create Course Modal (Hidden by default) -->
    <div class="modal-overlay" id="create-modal">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3>Create New Course</h3>
                <button class="close-modal" id="close-modal-btn">&times;</button>
            </div>
            
            <form id="create-course-form">
                <div class="form-group">
                    <label for="course-title">Course Title</label>
                    <input type="text" id="course-title" class="form-control" required placeholder="e.g. Advanced JavaScript">
                </div>
                <div class="form-group">
                    <label for="course-price">Price ($)</label>
                    <input type="number" id="course-price" class="form-control" required min="0" step="0.01" placeholder="99.99">
                </div>
                <!-- Instructor name is automatically handled by the backend or injected via JS -->
                <button type="submit" class="btn" id="create-course-btn">Create Course</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./js/api.js"></script>
    <script src="./js/dashboard.js"></script>
</body>
</html>
