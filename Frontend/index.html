<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyStack - Welcome</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    
    <div class="auth-container glass-panel">
        <div class="auth-header">
            <h1>StudyStack</h1>
            <p id="auth-subtitle">Welcome back! Please login.</p>
        </div>

        <!-- Login Form -->
        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" class="form-control" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn" id="login-btn">Log In</button>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="register-form" class="hidden">
            <div class="form-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" class="form-control" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" class="form-control" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" class="form-control" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label for="reg-role">I am a...</label>
                <select id="reg-role" class="form-control">
                    <option value="student">Student</option>
                    <option value="instructor">Instructor</option>
                </select>
            </div>
            <button type="submit" class="btn" id="reg-btn">Create Account</button>
        </form>

        <div class="toggle-auth" id="toggle-container">
            <span>Don't have an account?</span>
            <a id="toggle-link">Sign up</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
</body>
</html>
